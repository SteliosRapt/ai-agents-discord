# Copy to %USERPROFILE%\.ai-agents\config.toml (shared by the Claude and Codex plugin copies).
# Copy to config.toml and replace every placeholder with your Discord ids/paths.
# The Discord server is AI Agents. All ids must be quoted strings of digits.
guild_id = "000000000000000001"
# Only this owner's replies to question messages are accepted as answers.
owner_user_id = "000000000000000002"
# New project text channels are created inside this category.
agents_category_id = "000000000000000003"
# Only existing files resolved inside these directories may be uploaded.
# Use TOML literal strings for Windows paths. An empty list disables uploads.
upload_roots = ['C:\Users\YOUR_NAME\Projects']
# Optional additional channels agents may read. Own thread/project are implicit.
read_channel_ids = ["000000000000000004"]
# Optional: alert when a linked session's turn lasts at least this many minutes (default 10, integer >= 1).
long_turn_minutes = 10
# Optional: ping only the configured owner in attention/turn-finished alerts (default true, boolean).
alert_mentions_owner = true
